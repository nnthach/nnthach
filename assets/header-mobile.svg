<svg xmlns="http://www.w3.org/2000/svg" width="600" height="420" viewBox="0 0 600 420">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0EA5E9"/><stop offset="1" stop-color="#10B981"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#0EA5E9" opacity=".16"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0F9FF"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient>
<radialGradient id="b1"><stop stop-color="#7DD3FC" stop-opacity=".45"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop stop-color="#6EE7B7" stop-opacity=".4"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="dm"><rect width="600" height="420" fill="url(#fade)"/></mask>
<clipPath id="card"><rect width="600" height="420" rx="24"/></clipPath>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0369A1" flood-opacity=".12"/></filter>
<style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m,.m text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><style>
.flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.cur{animation:none}}
</style>
</defs>
<g clip-path="url(#card)">
<rect width="600" height="420" fill="url(#bg)"/>
<rect width="600" height="420" fill="url(#dots)" mask="url(#dm)"/>
<circle cx="560" cy="30" r="200" fill="url(#b1)"/><circle cx="520" cy="420" r="180" fill="url(#b2)"/>
</g>
<rect x="36" y="44" width="236" height="32" rx="8" fill="#FFFFFF" stroke="#BAE6FD"/>
<circle cx="54" cy="60" r="4" fill="#10B981" class="pulse"/>
<text class="m" x="68" y="65" font-size="14" fill="#0369A1">// fullstack developer</text>
<text x="34" y="148" font-size="58" font-weight="800" fill="#0F172A" letter-spacing="-1.5">Thach Nguyen</text>
<rect x="36" y="170" width="84" height="5" rx="2.5" fill="url(#acc)"/>
<text x="36" y="214" font-size="20" font-weight="600" fill="#334155">Build with purpose.</text>
<text x="36" y="242" font-size="20" font-weight="600" fill="#059669">Optimize with AI.</text>
<g class="m" font-size="13" font-weight="600">
<rect x="36" y="274" width="110" height="30" rx="8" fill="#E0F2FE"/><text x="91" y="294" text-anchor="middle" fill="#0369A1">web apps</text>
<rect x="156" y="274" width="166" height="30" rx="8" fill="#D1FAE5"/><text x="239" y="294" text-anchor="middle" fill="#047857">backend systems</text>
<rect x="36" y="314" width="158" height="30" rx="8" fill="#E0F2FE"/><text x="115" y="334" text-anchor="middle" fill="#0369A1">ai integrations</text>
</g>
<text class="m" x="36" y="378" font-size="13" fill="#64748B">status: <tspan fill="#059669">"building..."</tspan></text><rect class="cur" x="206" y="367" width="7" height="14" fill="#0EA5E9"/>
<rect x="24" y="417" width="552" height="3" rx="1.5" fill="url(#acc)" opacity=".8"/>
</svg>