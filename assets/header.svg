<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<defs><linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0EA5E9"/><stop offset="1" stop-color="#10B981"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#0EA5E9" opacity=".16"/></pattern>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0F9FF"/><stop offset="1" stop-color="#ECFDF5"/></linearGradient>
<radialGradient id="b1"><stop stop-color="#7DD3FC" stop-opacity=".45"/><stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/></radialGradient>
<radialGradient id="b2"><stop stop-color="#6EE7B7" stop-opacity=".4"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset=".25" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="dm"><rect width="1200" height="340" fill="url(#fade)"/></mask>
<clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0369A1" flood-opacity=".12"/></filter>
<style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m,.m text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style><style>
.flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.cur{animation:none}}
</style>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="340" fill="url(#bg)"/>
